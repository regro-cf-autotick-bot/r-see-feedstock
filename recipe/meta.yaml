{% set version = "0.14.1" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-see
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/see_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/see/see_{{ version }}.tar.gz
  sha256: c3e2f7e7398a93387ec74e813ab185582227175f0e012e6d2fc1814be7f5716d

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-bayestestr >=0.17.0
    - r-correlation >=0.8.8
    - r-datawizard >=1.2.0
    - r-effectsize >=1.0.1
    - r-ggplot2 >=4.0.0
    - r-insight >=1.4.1
    - r-modelbased >=0.13.0
    - r-parameters >=0.28.1
    - r-patchwork >=1.3.2
    - r-performance >=0.15.1
  run:
    - r-base
    - r-bayestestr >=0.17.0
    - r-correlation >=0.8.8
    - r-datawizard >=1.2.0
    - r-effectsize >=1.0.1
    - r-ggplot2 >=4.0.0
    - r-insight >=1.4.1
    - r-modelbased >=0.13.0
    - r-parameters >=0.28.1
    - r-patchwork >=1.3.2
    - r-performance >=0.15.1

test:
  commands:
    - $R -e "library('see')"           # [not win]
    - "\"%R%\" -e \"library('see')\""  # [win]

about:
  home: https://easystats.github.io/see/
  license: MIT
  summary: Provides plotting utilities supporting easystats-packages (<https://github.com/easystats/easystats>) and some extra themes, geoms, and scales for 'ggplot2'. Color scales are based on <https://www.materialui.co/colors>.
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
    - SGMartin

